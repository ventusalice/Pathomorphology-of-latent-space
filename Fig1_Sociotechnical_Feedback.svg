  <title
     id="fig-title">Sociotechnical feedback across three levels of pathomorphological analysis</title>
  <desc
     id="fig-desc">Model behavior leads to human interpretation and then cultural circulation. Solid feedback paths return circulated material through prompting and retrieval, without parameter updates, or through human-selected data and targeted fine-tuning, which update parameters. A dashed conditional path separates web collection, future corpus inclusion, pre-training, and future model parameters.</desc>
